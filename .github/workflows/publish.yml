name: Publish

on:
  push:
    branches: [main]
  schedule:
    # Mondays, 06:00 UTC: refresh the CV from the Google Sheet and redeploy.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write   # allow the CV-refresh commit back to main
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh CV from Google Sheet
        run: python scripts/build_cv.py

      - name: Commit refreshed CV data
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet -- data/cv _cv; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/cv _cv
            git commit -m "chore: refresh CV from Google Sheet"
            git push
          else
            echo "CV unchanged, nothing to commit."
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
